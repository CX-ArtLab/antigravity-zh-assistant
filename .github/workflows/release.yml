name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        shell: powershell
        run: .\build.ps1
      - name: Package portable ZIP
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "AntigravityZhAssistant"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath "dist\AntigravityZhAssistant.exe" -Destination $stage
          Copy-Item -LiteralPath "README.md" -Destination $stage
          Copy-Item -LiteralPath "LICENSE" -Destination $stage
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "dist\AntigravityZhAssistant-windows.zip" -Force
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityZhAssistant-windows
          path: dist/AntigravityZhAssistant-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build macOS app and ZIP
        shell: bash
        run: bash macOS/build-macos.sh
      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityZhAssistant-macOS-apple-silicon
          path: dist/AntigravityZhAssistant-macOS-apple-silicon.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ADAPTED_VER="$(python3 -c 'import json; print(json.load(open("translation/manifest.json")).get("adaptedAntigravityVersion", ""))' 2>/dev/null || true)"
          TITLE="Antigravity 中文助手 ${{ github.ref_name }}"
          if [ -n "$ADAPTED_VER" ]; then
            TITLE="${TITLE}（适配 Antigravity ${ADAPTED_VER}）"
          fi
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ] && ! git diff --quiet "$PREV_TAG" HEAD -- src/Program.cs src/app.manifest src/translator.js macOS/Sources macOS/Resources/translator.js macOS/Info.plist; then
            NOTICE="> ⚠️ **主程序更新（需重新下载）**：本次包含主程序或动态脚本逻辑改动，请重新下载新版安装包覆盖本地程序。"
          else
            NOTICE="> 💡 **词典更新（在线生效，无需下载）**：已安装主程序的用户，开启「自动更新」或点击界面上的「更新词典」即可直接生效，无需重新下载主程序。"
          fi
          gh release create "${{ github.ref_name }}" dist/*.zip --repo "${{ github.repository }}" --generate-notes --notes "$NOTICE" --title "$TITLE"
